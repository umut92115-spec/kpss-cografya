name: KPSS Geography Bot

on:
  schedule:
    - cron: '0 * * * *' # Her saat başı
  workflow_dispatch: # Manuel tetikleme için

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install @google/generative-ai@latest dotenv

      - name: Run Bot Task
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEXT_PUBLIC_SITE_URL: https://kpsscografya.com.tr
        run: node src/scripts/bot-task.mjs

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/quiz/*.json data/rotation.json
          git commit -m "🤖 Bot: Yeni soru eklendi ve rotasyon güncellendi [skip ci]" || echo "No changes to commit"
          git push
