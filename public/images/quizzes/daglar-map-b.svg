<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <!-- Map Fill Gradient -->
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#311042" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Marker Glow -->
    <filter id="markerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.22   0 0 0 0 0.74   0 0 0 0 0.97  0 0 0 0.8 0"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGrad)"/>
  <rect width="800" height="400" fill="url(#grid)"/>

  <!-- Compass / Subtle UI Elements -->
  <g transform="translate(740, 60)" opacity="0.15">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <line x1="0" y1="-35" x2="0" y2="35" stroke="#38bdf8" stroke-width="1"/>
    <line x1="-35" y1="0" x2="35" y2="0" stroke="#38bdf8" stroke-width="1"/>
    <text x="0" y="-38" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">K</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(40, 50)" opacity="0.85">
    <rect width="180" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="20" cy="16" r="5" fill="#38bdf8" filter="url(#glow)"/>
    <text x="36" y="20" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#94a3b8">ÖSYM HARİTA ŞABLONU - B</text>
  </g>

  <!-- Stylized Turkey Outline Map -->
  <path d="M 120 100 
           L 100 130 
           C 90 150, 85 170, 95 190 
           C 85 210, 85 220, 105 230 
           C 90 250, 95 270, 105 290 
           L 130 295 
           C 160 300, 180 325, 210 320 
           C 230 300, 245 280, 270 310 
           C 290 320, 320 320, 340 280 
           L 365 290 
           C 375 320, 390 340, 410 335 
           C 430 325, 460 320, 480 315 
           L 530 310 
           C 560 310, 580 325, 610 320 
           C 640 320, 670 330, 700 335 
           L 755 330 
           C 770 315, 775 295, 765 270 
           C 780 250, 770 210, 785 190 
           C 775 160, 785 130, 755 125 
           C 730 110, 700 115, 680 105 
           C 650 115, 610 120, 580 120 
           C 555 120, 530 115, 505 130 
           C 475 110, 440 105, 415 120 
           C 385 125, 355 125, 325 130 
           C 295 130, 265 130, 240 145 
           C 215 150, 190 145, 170 140 
           C 150 120, 140 110, 120 100 Z"
        fill="url(#mapGrad)" 
        stroke="#0284c7" 
        stroke-width="3" 
        stroke-linejoin="round" 
        stroke-linecap="round" 
        filter="url(#glow)"/>

  <!-- Glowing Radar Circle Markers (I, II, III, IV, V) -->
  
  <!-- Marker I (Biga Dağları) -->
  <g transform="translate(100, 145)">
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" filter="url(#markerGlow)"/>
    <circle cx="0" cy="0" r="10" fill="#38bdf8" opacity="0.15"/>
    <text x="0" y="4" font-family="Inter, system-ui, sans-serif" font-weight="bold" font-size="11" fill="#ffffff" text-anchor="middle">I</text>
  </g>

  <!-- Marker II (Menteşe Dağları - Southwest) -->
  <g transform="translate(95, 275)">
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" filter="url(#markerGlow)"/>
    <circle cx="0" cy="0" r="10" fill="#38bdf8" opacity="0.15"/>
    <text x="0" y="4" font-family="Inter, system-ui, sans-serif" font-weight="bold" font-size="11" fill="#ffffff" text-anchor="middle">II</text>
  </g>

  <!-- Marker III (Erciyes Dağı) -->
  <g transform="translate(400, 220)">
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" filter="url(#markerGlow)"/>
    <circle cx="0" cy="0" r="10" fill="#38bdf8" opacity="0.15"/>
    <text x="0" y="4" font-family="Inter, system-ui, sans-serif" font-weight="bold" font-size="11" fill="#ffffff" text-anchor="middle">III</text>
  </g>

  <!-- Marker IV (Canik Dağları - Central Black Sea) -->
  <g transform="translate(490, 125)">
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" filter="url(#markerGlow)"/>
    <circle cx="0" cy="0" r="10" fill="#38bdf8" opacity="0.15"/>
    <text x="0" y="4" font-family="Inter, system-ui, sans-serif" font-weight="bold" font-size="11" fill="#ffffff" text-anchor="middle">IV</text>
  </g>

  <!-- Marker V (Karacadağ - Southeast Shield Volcano) -->
  <g transform="translate(580, 280)">
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" filter="url(#markerGlow)"/>
    <circle cx="0" cy="0" r="10" fill="#38bdf8" opacity="0.15"/>
    <text x="0" y="4" font-family="Inter, system-ui, sans-serif" font-weight="bold" font-size="11" fill="#ffffff" text-anchor="middle">V</text>
  </g>

</svg>
